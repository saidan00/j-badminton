<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thành Tích Cầu Lông</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    :root {
      --court: #0b4f35;
      --court-hi: #13804f;
      --court-deep: #052e1e;
      --lime: #d8ff3c;
      --lime-deep: #a9d400;
      --lime-ink: #182300;
      --paper: #fbfcf8;
      --paper-2: #eff3ea;
      --ink: #0c1d15;
      --muted: #5d6c64;
      --rule: #dde4d8;
      --team-a: #45c3ff;
      --team-a-ink: #0a76ad;
      --team-b: #ff7d6e;
      --team-b-ink: #c9402f;
      --female: #ec4899;
      --board: #03130b;
      --board-2: #0b2a1c;
      --radius: 22px;
      --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
      --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      font-family: var(--body);
      color: var(--ink);
      background:
        radial-gradient(120% 70% at 50% -10%, var(--court-hi) 0%, transparent 60%),
        radial-gradient(90% 60% at 50% 115%, var(--court-deep) 0%, transparent 70%),
        var(--court);
      overflow-x: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Sân cầu vẽ nền ---------- */
    .court {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(1500px, 140vw);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 899px) {
      .court {
        width: min(150vh, 230vw);
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    /* ---------- Header ---------- */
    .hero {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #fff;
      margin-bottom: 22px;
    }

    .logo {
      flex: none;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--lime);
      color: var(--ink);
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 7px rgba(216, 255, 60, .16), 0 14px 30px -8px rgba(0, 0, 0, .45);
    }

    .logo svg {
      width: 46px;
      height: 46px;
      transform: rotate(-32deg);
    }

    .club-logo {
      flex: none;
      width: 96px;
      height: 96px;
      margin-left: auto;
      padding: 8px;
      border-radius: 50%;
      background: #fff;
      object-fit: contain;
      box-shadow: 0 0 0 4px var(--lime), 0 0 0 11px rgba(216, 255, 60, .16), 0 14px 30px -8px rgba(0, 0, 0, .45);
    }

    .eyebrow {
      font: 600 12px/1 var(--body);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--lime);
    }

    h1 {
      font: italic 800 clamp(38px, 8vw, 66px)/.9 var(--display);
      text-transform: uppercase;
      letter-spacing: .005em;
      margin-top: 8px;
    }

    h1 span {
      color: var(--lime);
    }

    @media (max-width: 520px) {
      .hero {
        align-items: flex-start;
        gap: 14px;
      }

      .logo {
        width: 56px;
        height: 56px;
        margin-top: 4px;
      }

      .logo svg {
        width: 34px;
        height: 34px;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: .1em;
        white-space: nowrap;
      }

      .club-logo {
        width: 64px;
        height: 64px;
        padding: 5px;
        margin-top: 4px;
        box-shadow: 0 0 0 3px var(--lime), 0 0 0 8px rgba(216, 255, 60, .16), 0 10px 24px -8px rgba(0, 0, 0, .45);
      }
    }

    /* ---------- Bộ lọc ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-bottom: 24px;
    }

    .seg {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .seg-label {
      margin-right: 4px;
      font: 600 11px/1 var(--body);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .55);
    }

    .seg button {
      height: 32px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .09);
      color: #e6f4ec;
      font: 600 13px/1 var(--body);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .seg button:hover {
      background: rgba(255, 255, 255, .16);
    }

    .seg button[aria-pressed="true"] {
      background: var(--lime);
      border-color: var(--lime);
      color: var(--lime-ink);
    }

    .seg button:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }

    /* ---------- Bố cục ---------- */
    .grid {
      display: grid;
      gap: 20px;
    }

    @media (min-width: 900px) {

      /* Khe giữa 2 cột trùng với lưới sân ở nền */
      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 64px;
        align-items: start;
      }
    }

    .card {
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .55), 0 2px 0 rgba(255, 255, 255, .5) inset;
      overflow: hidden;
    }

    .section {
      padding: 22px 20px 18px;
    }

    .sec-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .sec-title h2 {
      font: 800 22px/1 var(--display);
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .sec-title h2 em {
      font-style: italic;
      color: var(--court-hi);
      margin-right: 6px;
    }

    .sec-title p {
      font: 500 12px/1.3 var(--body);
      color: var(--muted);
      text-align: right;
    }

    .error {
      margin-bottom: 20px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff0ec;
      color: #b3261e;
      font: 600 14px/1.4 var(--body);
    }

    .error ul {
      margin-top: 4px;
      padding-left: 18px;
      font-weight: 500;
    }

    .empty {
      padding: 18px 0;
      text-align: center;
      font: 500 14px/1.4 var(--body);
      color: var(--muted);
    }

    /* ---------- Bảng xếp hạng ---------- */
    .lb {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .lb th {
      padding: 0 5px 10px;
      border-bottom: 2px solid var(--ink);
      font: 600 11px/1 var(--body);
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .lb td {
      padding: 10px 5px;
      border-bottom: 1px solid var(--rule);
      text-align: right;
      font: 700 19px/1 var(--display);
      white-space: nowrap;
    }

    .lb th:first-child,
    .lb td.rank {
      width: 34px;
      padding-left: 0;
      text-align: center;
    }

    .lb th:last-child,
    .lb td:last-child {
      padding-right: 0;
    }

    .lb th.who,
    .lb td.who {
      width: 100%;
      text-align: left;
    }

    .lb td.who {
      white-space: normal;
    }

    .rank b {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font: 800 17px/1 var(--display);
    }

    .row.is-top .rank b {
      background: var(--lime);
      color: var(--lime-ink);
      box-shadow: 0 0 0 3px rgba(169, 212, 0, .25);
    }

    .who button {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 4px 0;
      border: 0;
      background: none;
      font: 600 15px/1.2 var(--body);
      text-align: left;
      cursor: pointer;
    }

    .who button:focus-visible {
      outline: 2px solid var(--lime-deep);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .ico-f {
      width: 15px;
      height: 15px;
      margin-left: 4px;
      color: var(--female);
      vertical-align: -2px;
    }

    .chev {
      flex: none;
      width: 16px;
      height: 16px;
      color: var(--muted);
      transition: transform .2s;
    }

    .who button[aria-expanded="true"] .chev,
    .tourney[open] .chev {
      transform: rotate(180deg);
    }

    .row.is-low td {
      color: var(--muted);
    }

    .lb-note {
      margin-top: 12px;
      font: 500 12px/1.4 var(--body);
      color: var(--muted);
    }

    /* ---------- Chi tiết cá nhân ---------- */
    .lb tr.detail td {
      padding: 0 0 12px;
      text-align: left;
      font: inherit;
      white-space: normal;
    }

    .pd {
      padding: 14px;
      border-radius: 14px;
      background: var(--paper-2);
    }

    .pd-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .pd-stats dt {
      font: 500 12px/1.2 var(--body);
      color: var(--muted);
    }

    .pd-stats dd {
      margin-top: 4px;
      font: 700 21px/1.1 var(--display);
      font-variant-numeric: tabular-nums;
    }

    .pd-stats dd small {
      margin-left: 4px;
      font: 600 15px/1 var(--display);
      color: var(--muted);
    }

    .pd-log {
      list-style: none;
      margin-top: 14px;
      padding: 4px 0 0;
      border-top: 1.5px dashed var(--rule);
    }

    .pd-log li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding-top: 9px;
      font: 500 13px/1.35 var(--body);
    }

    .wl {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid var(--rule);
      background: #fff;
      font: 800 13px/1 var(--display);
      color: var(--muted);
    }

    .is-win .wl {
      border-color: var(--court-hi);
      background: var(--court-hi);
      color: #fff;
    }

    .pd-text small {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .pd-score {
      font: 700 18px/1 var(--display);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Lịch sử giải ---------- */
    .history {
      display: grid;
      gap: 20px;
    }

    .tourney>summary {
      list-style: none;
      cursor: pointer;
    }

    .tourney>summary::-webkit-details-marker {
      display: none;
    }

    .tourney>summary:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: -3px;
      border-radius: var(--radius);
    }

    .board {
      position: relative;
      padding: 16px 18px 22px;
      color: #fff;
      background: radial-gradient(120% 100% at 50% 0%, var(--board-2), var(--board));
    }

    .board::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.3px);
      background-size: 6px 6px;
      pointer-events: none;
    }

    .board-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
      font: 700 12px/1 var(--body);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .7);
    }

    .board-top b {
      color: var(--lime);
      font-weight: 700;
    }

    .board-date {
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: .08em;
      font-variant-numeric: tabular-nums;
    }

    .board .chev {
      color: rgba(255, 255, 255, .6);
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      padding-top: 18px;
    }

    .team {
      --c: var(--team-a);
      text-align: center;
      min-width: 0;
    }

    .team--b {
      --c: var(--team-b);
    }

    .team-name {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      font: 800 20px/1 var(--display);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .team-name::before {
      content: "";
      width: 30px;
      height: 4px;
      border-radius: 2px;
      background: var(--c);
      box-shadow: 0 0 12px var(--c);
    }

    .team-name small {
      font: 500 12px/1.45 var(--body);
      letter-spacing: .02em;
      text-transform: none;
      color: rgba(255, 255, 255, .55);
      text-wrap: balance;
    }

    .score {
      margin-top: 12px;
      font: 700 clamp(40px, 11vw, 66px)/1 var(--display);
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow: 0 0 26px color-mix(in srgb, var(--c) 55%, transparent);
    }

    .team.is-lose .score {
      opacity: .4;
      text-shadow: none;
    }

    .win-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--lime);
      color: var(--lime-ink);
      font: 800 13px/1 var(--display);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .net {
      width: 2px;
      margin: 2px 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .4) 0 4px, transparent 4px 9px);
    }

    .matches {
      list-style: none;
      padding: 8px 18px 14px;
    }

    .m {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--rule);
      font: 500 14px/1.25 var(--body);
      color: var(--muted);
    }

    .m:last-child {
      border-bottom: 0;
    }

    .m-no {
      font: 700 13px/1 var(--display);
      opacity: .7;
    }

    .m-a {
      text-align: right;
    }

    .m-side.win {
      font-weight: 700;
    }

    .nm {
      white-space: nowrap;
    }

    .m-a.win {
      color: var(--team-a-ink);
    }

    .m-b.win {
      color: var(--team-b-ink);
    }

    .m-score {
      font: 700 20px/1 var(--display);
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;
    }

    .m-score b {
      font-weight: 600;
    }

    .m-score b.win {
      font-weight: 800;
      color: var(--ink);
    }

    .m-score small {
      display: block;
      margin-top: 3px;
      font: 700 10px/1 var(--body);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--court-hi);
    }

    @media (max-width: 420px) {
      .section {
        padding: 20px 14px 16px;
      }

      .lb td {
        font-size: 17px;
      }

      .who button {
        font-size: 14px;
      }

      .matches {
        padding: 6px 14px 12px;
      }

      .m {
        gap: 8px;
        font-size: 13px;
      }
    }

    /* Máy rất hẹp: bỏ logo cầu để logo CLB không bị đẩy tràn ra ngoài */
    @media (max-width: 359px) {
      .logo {
        display: none;
      }
    }

    .foot {
      margin-top: 28px;
      text-align: center;
      font: 500 12px/1.5 var(--body);
      color: rgba(255, 255, 255, .55);
    }

    .foot a {
      color: var(--lime);
      font-weight: 600;
      text-decoration: none;
    }

    .foot a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="shuttle" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 40 L12 8 Q17 4 22 7 Q27 3 32 6 Q37 3 42 7 Q47 4 52 8 L40 40 Z"
          style="fill: var(--feather, #fff)" />
        <path d="M28 40 L21 7 M32 40 V6 M36 40 L43 7 M17.3 22 H46.7" />
        <path d="M22 40 H42 V44 A10 10 0 0 1 22 44 Z" fill="currentColor" />
      </g>
    </symbol>
    <symbol id="female" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <circle cx="12" cy="9" r="5.5" />
        <path d="M12 14.5V22M8.5 18.5h7" />
      </g>
    </symbol>
    <symbol id="chev" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </symbol>
  </svg>

  <svg class="court" viewBox="-40 -40 1420 690" aria-hidden="true">
    <g fill="none" stroke="rgba(255,255,255,.15)" stroke-width="5">
      <rect x="0" y="0" width="1340" height="610" fill="rgba(255,255,255,.025)" />
      <path d="M0 46H1340 M0 564H1340 M76 0V610 M1264 0V610 M472 0V610 M868 0V610 M0 305H472 M868 305H1340" />
    </g>
    <line x1="670" y1="-28" x2="670" y2="638" stroke="rgba(255,255,255,.3)" stroke-width="6" stroke-dasharray="3 8" />
    <circle cx="670" cy="-28" r="9" fill="rgba(255,255,255,.3)" />
    <circle cx="670" cy="638" r="9" fill="rgba(255,255,255,.3)" />
  </svg>

  <main class="wrap">
    <header class="hero">
      <div class="logo"><svg>
          <use href="#shuttle" />
        </svg></div>
      <div>
        <p class="eyebrow">CLB Cầu Lông Huy Tran</p>
        <h1>Thành tích <span>cá nhân</span></h1>
      </div>
      <img class="club-logo" alt="CLB Cầu Lông Huy Tran" src="logo.jpg">
    </header>

    <nav class="filters" id="filters" aria-label="Bộ lọc"></nav>

    <div class="error" id="error" role="alert" hidden></div>

    <div class="grid">
      <section class="card section">
        <div class="sec-title">
          <h2><em>01</em>Bảng xếp hạng</h2>
          <p id="rankHint"></p>
        </div>
        <table class="lb">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col" class="who">Người chơi</th>
              <th scope="col" title="Số trận thắng / tổng số trận">Thắng</th>
              <th scope="col">Tỉ lệ</th>            </tr>
          </thead>
          <tbody id="rankBody"></tbody>
        </table>
        <p class="lb-note" id="rankNote" hidden></p>
      </section>

      <section class="history" id="history" aria-label="Lịch sử giải"></section>
    </div>

    <p class="foot"><a href="./">← Chia tiền cầu lông</a></p>
  </main>

  <script>
    (() => {
      const DATA_URLS = ['data/players.json', 'data/tournaments.json'];
      // Dưới số trận này thì vẫn hiện nhưng chưa xếp hạng, tránh 1 trận thắng 1 là 100%.
      const MIN_MATCHES = 4;
      const TYPE_LABEL = { monthly: 'Giải tháng', quarterly: 'Giải quý' };
      const SIDES = ['a', 'b'];

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const chev = '<svg class="chev" aria-hidden="true"><use href="#chev" /></svg>';
      const femaleIcon = '<svg class="ico-f" role="img" aria-label="Nữ"><title>Nữ</title><use href="#female" /></svg>';
      const pct = (r) => Math.round(r * 100) + '%';
      const rate = (s) => s.won / s.played;
      const other = (side) => (side === 'a' ? 'b' : 'a');

      let players = new Map();
      let tournaments = [];
      const filter = { type: 'all', year: 'all' };
      const expanded = new Set();

      const nameOf = (id) => players.get(id)?.name ?? id;
      const pairName = (ids) => ids.map(nameOf).join(' & ');
      // Chỉ cho xuống dòng giữa các tên, không cắt đôi "Hoàng Anh".
      const namesHtml = (ids, sep) => ids.map((id) => `<span class="nm">${esc(nameOf(id))}</span>`).join(sep);

      function parseDate(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        return { y, m, d };
      }

      function fmtDate(iso) {
        const { y, m, d } = parseDate(iso);
        return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
      }

      function titleOf(t) {
        if (t.name) return t.name;
        const { y, m } = parseDate(t.date);
        return t.type === 'quarterly' ? `Giải quý ${Math.ceil(m / 3)}/${y}` : `Giải tháng ${m}/${y}`;
      }

      // JSON sửa tay nên dễ gõ sai: bỏ qua phần sai thay vì vỡ trang, và liệt kê lỗi để sửa.
      function validate(rawPlayers, rawTournaments) {
        const errors = [];
        const map = new Map();
        for (const p of Array.isArray(rawPlayers) ? rawPlayers : []) {
          if (!p?.id || !p?.name) {
            errors.push(`players.json: thiếu id hoặc name ở ${JSON.stringify(p)}`);
            continue;
          }
          if (map.has(p.id)) errors.push(`players.json: trùng id "${p.id}"`);
          map.set(p.id, p);
        }

        const list = [];
        for (const t of Array.isArray(rawTournaments) ? rawTournaments : []) {
          const label = `Giải ${t?.id ?? t?.date ?? '?'}`;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(t?.date ?? '') || !TYPE_LABEL[t.type] || !Array.isArray(t.matches)) {
            errors.push(`${label}: cần date dạng YYYY-MM-DD, type là monthly hoặc quarterly, và có matches`);
            continue;
          }
          const matches = t.matches.filter((m, i) => {
            const where = `${label}, trận ${i + 1}`;
            const sides = [m?.a, m?.b];
            if (!sides.every((s) => Array.isArray(s) && s.length >= 1 && s.length <= 2)) {
              errors.push(`${where}: a và b phải có 1–2 người`);
              return false;
            }
            const unknown = sides.flat().filter((id) => !map.has(id));
            if (unknown.length) {
              errors.push(`${where}: không có ${unknown.map((u) => `"${u}"`).join(', ')} trong players.json`);
              return false;
            }
            if (new Set(sides.flat()).size !== sides.flat().length) {
              errors.push(`${where}: một người xuất hiện 2 lần`);
              return false;
            }
            const s = m.score;
            if (!Array.isArray(s) || s.length !== 2 || !s.every(Number.isInteger) || s[0] === s[1]) {
              errors.push(`${where}: score phải là [điểm A, điểm B] và không hoà`);
              return false;
            }
            return true;
          });
          list.push({ ...t, matches });
        }
        return { players: map, tournaments: list, errors };
      }

      // Đội A là những ai từng đứng bên a; không cố định 5 người vì đội có thể chênh người.
      function teamResult(t) {
        const rosters = { a: new Set(), b: new Set() };
        const wins = { a: 0, b: 0 };
        for (const m of t.matches) {
          for (const side of SIDES) m[side].forEach((id) => rosters[side].add(id));
          wins[m.score[0] > m.score[1] ? 'a' : 'b']++;
        }
        const winner = wins.a > wins.b ? 'a' : wins.b > wins.a ? 'b' : null;
        return { rosters, wins, winner };
      }

      function buildStats(list) {
        const stats = new Map();
        const entry = (id) => {
          if (!stats.has(id)) {
            stats.set(id, { id, played: 0, won: 0, events: 0, teamWins: 0, partners: new Map(), log: [] });
          }
          return stats.get(id);
        };

        for (const t of list) {
          for (const side of SIDES) {
            for (const id of t.result.rosters[side]) {
              const s = entry(id);
              s.events++;
              if (t.result.winner === side) s.teamWins++;
            }
          }

          t.matches.forEach((m, i) => {
            for (const side of SIDES) {
              const mine = m.score[side === 'a' ? 0 : 1];
              const theirs = m.score[side === 'a' ? 1 : 0];
              const won = mine > theirs;
              for (const id of m[side]) {
                const s = entry(id);
                s.played++;
                if (won) s.won++;

                const partner = m[side].find((x) => x !== id);
                if (partner) {
                  const ps = s.partners.get(partner) ?? { played: 0, won: 0, diff: 0 };
                  ps.played++;
                  if (won) ps.won++;
                  ps.diff += mine - theirs;
                  s.partners.set(partner, ps);
                }
                s.log.push({ t, i, partner, opp: m[other(side)], mine, theirs, won, decider: m.decider });
              }
            }
          });
        }
        return [...stats.values()];
      }

      // Cùng tỉ lệ và số trận thắng thì đồng hạng (1, 2, 2, 4…); trong cùng hạng xếp theo tên.
      const sameRank = (x, y) => x.won * y.played === y.won * x.played && x.won === y.won;
      const byRank = (x, y) => rate(y) - rate(x) || y.won - x.won
        || nameOf(x.id).localeCompare(nameOf(y.id), 'vi');

      function filtered() {
        return tournaments.filter((t) => (filter.type === 'all' || t.type === filter.type)
          && (filter.year === 'all' || t.date.startsWith(filter.year)));
      }

      function renderFilters() {
        const years = [...new Set(tournaments.map((t) => t.date.slice(0, 4)))].sort().reverse();
        const group = (key, label, options) => `
          <div class="seg" role="group" aria-label="${label}">
            <span class="seg-label">${label}</span>
            ${options.map(([value, text]) => `
              <button type="button" data-key="${key}" data-value="${value}"
                aria-pressed="${filter[key] === value}">${text}</button>`).join('')}
          </div>`;
        $('filters').innerHTML =
          group('type', 'Loại giải', [['all', 'Tất cả'], ...Object.entries(TYPE_LABEL)])
          + group('year', 'Năm', [['all', 'Tất cả'], ...years.map((y) => [y, y])]);
      }

      function detail(s) {
        const best = [...s.partners.entries()].sort(([, x], [, y]) =>
          rate(y) - rate(x) || y.played - x.played || y.diff - x.diff)[0];
        const log = [...s.log].sort((x, y) => y.t.date.localeCompare(x.t.date) || x.i - y.i);
        return `
          <div class="pd">
            <dl class="pd-stats">
              <div><dt>Giải tham gia</dt><dd>${s.events}</dd></div>
              <div><dt>Đội thắng chung cuộc</dt><dd>${s.teamWins}/${s.events}</dd></div>              <div><dt>Đánh cặp ăn ý nhất</dt><dd>${best
            ? `${esc(nameOf(best[0]))}<small>${best[1].won}/${best[1].played}</small>` : '—'}</dd></div>
            </dl>
            <ol class="pd-log">
              ${log.map((e) => `
                <li class="${e.won ? 'is-win' : ''}">
                  <span class="wl" aria-label="${e.won ? 'Thắng' : 'Thua'}">${e.won ? 'T' : 'B'}</span>
                  <span class="pd-text">${e.partner ? `cùng <b>${esc(nameOf(e.partner))}</b>` : 'Đánh đơn'}
                    gặp ${esc(pairName(e.opp))}
                    <small>${esc(titleOf(e.t))} · trận ${e.i + 1}${e.decider ? ' · quyết định' : ''}</small></span>
                  <span class="pd-score">${e.mine}–${e.theirs}</span>
                </li>`).join('')}
            </ol>
          </div>`;
      }

      function renderRanking(stats) {
        $('rankHint').textContent = `Theo tỉ lệ thắng, từ ${MIN_MATCHES} trận`;
        const body = $('rankBody');
        const note = $('rankNote');
        if (!stats.length) {
          body.innerHTML = '<tr><td colspan="4" class="empty">Chưa có trận nào.</td></tr>';
          note.hidden = true;
          return;
        }

        const ranked = stats.filter((s) => s.played >= MIN_MATCHES).sort(byRank);
        const low = stats.filter((s) => s.played < MIN_MATCHES).sort(byRank);
        let rank = 0;
        const rows = [...ranked, ...low].map((s, i) => {
          const isLow = s.played < MIN_MATCHES;
          if (!isLow && (i === 0 || !sameRank(ranked[i - 1], s))) rank = i + 1;
          const p = players.get(s.id);
          const open = expanded.has(s.id);
          const cls = ['row', isLow ? 'is-low' : '', !isLow && rank === 1 ? 'is-top' : ''].filter(Boolean).join(' ');
          return `
            <tr class="${cls}">
              <td class="rank"><b>${isLow ? '–' : rank}</b></td>
              <td class="who">
                <button type="button" data-id="${esc(s.id)}" aria-expanded="${open}" aria-controls="pd-${esc(s.id)}">
                  <span>${esc(p.name)}${p.gender === 'F' ? femaleIcon : ''}</span>
                  ${chev}
                </button>
              </td>
              <td>${s.won}/${s.played}</td>
              <td>${pct(rate(s))}</td>            </tr>
            <tr class="detail" id="pd-${esc(s.id)}"${open ? '' : ' hidden'}><td colspan="4">${detail(s)}</td></tr>`;
        });
        body.innerHTML = rows.join('');
        note.hidden = !low.length;
        note.textContent = `Chữ mờ: chưa đủ ${MIN_MATCHES} trận nên chưa xếp hạng.`;
      }

      function renderHistory(list) {
        const el = $('history');
        if (!list.length) {
          el.innerHTML = '<div class="card section empty">Chưa có giải nào khớp bộ lọc.</div>';
          return;
        }
        const team = (t, side) => {
          const r = t.result;
          const state = r.winner === side ? ' is-win' : r.winner ? ' is-lose' : '';
          return `
            <div class="team team--${side}${state}">
              <div class="team-name">${esc(t.teams?.[side] ?? `Đội ${side.toUpperCase()}`)}
                <small>${namesHtml([...r.rosters[side]], ' · ')}</small></div>
              <div class="score">${r.wins[side]}</div>
              ${r.winner === side ? '<span class="win-tag">Thắng</span>' : ''}
            </div>`;
        };
        const match = (m, i) => {
          const aWon = m.score[0] > m.score[1];
          return `
            <li class="m">
              <span class="m-no">${i + 1}</span>
              <span class="m-side m-a${aWon ? ' win' : ''}">${namesHtml(m.a, ' & ')}</span>
              <span class="m-score"><b class="${aWon ? 'win' : ''}">${m.score[0]}</b>–<b
                class="${aWon ? '' : 'win'}">${m.score[1]}</b>${m.decider ? '<small>Quyết định</small>' : ''}</span>
              <span class="m-side m-b${aWon ? '' : ' win'}">${namesHtml(m.b, ' & ')}</span>
            </li>`;
        };
        el.innerHTML = [...list].sort((x, y) => y.date.localeCompare(x.date)).map((t, idx) => `
          <details class="card tourney"${idx === 0 ? ' open' : ''}>
            <summary class="board">
              <div class="board-top">
                <span>${esc(titleOf(t))}${t.result.winner ? '' : ' · <b>Hoà</b>'}</span>
                <span class="board-date">${fmtDate(t.date)}${chev}</span>
              </div>
              <div class="teams">${team(t, 'a')}<div class="net"></div>${team(t, 'b')}</div>
            </summary>
            <ol class="matches">${t.matches.map(match).join('')}</ol>
          </details>`).join('');
      }

      function render() {
        const list = filtered();
        const stats = buildStats(list);
        renderFilters();
        renderRanking(stats);
        renderHistory(list);
      }

      function showErrors(errors) {
        const el = $('error');
        el.hidden = !errors.length;
        el.innerHTML = errors.length
          ? `Dữ liệu có lỗi, phần sai đã bị bỏ qua:<ul>${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>`
          : '';
      }

      $('filters').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-key]');
        if (!btn) return;
        filter[btn.dataset.key] = btn.dataset.value;
        render();
      });

      $('rankBody').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-id]');
        if (!btn) return;
        const id = btn.dataset.id;
        const open = !expanded.has(id);
        open ? expanded.add(id) : expanded.delete(id);
        btn.setAttribute('aria-expanded', open);
        $(`pd-${id}`).hidden = !open;
      });

      async function load() {
        try {
          const [rawPlayers, rawTournaments] = await Promise.all(DATA_URLS.map(async (url) => {
            const res = await fetch(url, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
            return res.json().catch((err) => { throw new Error(`${url}: JSON sai cú pháp (${err.message})`); });
          }));
          const data = validate(rawPlayers, rawTournaments);
          players = data.players;
          tournaments = data.tournaments.map((t) => ({ ...t, result: teamResult(t) }));
          showErrors(data.errors);
          render();
        } catch (err) {
          const msg = location.protocol === 'file:'
            ? 'Trình duyệt chặn đọc file JSON khi mở trang trực tiếp từ máy. Hãy mở qua web server, ví dụ chạy "python3 -m http.server" trong thư mục này rồi vào http://localhost:8000/stats.html.'
            : `Không tải được dữ liệu: ${err.message}`;
          const el = $('error');
          el.hidden = false;
          el.textContent = msg;
        }
      }

      load();
    })();
  </script>
</body>

</html>
